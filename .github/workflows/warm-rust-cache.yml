# Behavior: spec/spec-process-cicd-warm-rust-cache.md
# Tag-only publish jobs cannot reuse caches saved on previous tags.
# Saving the release target on master lets pre-publish / publish restore it.
name: Warm Rust cache
on:
  push:
    branches: [master]
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - src-tauri/src/**
      - src-tauri/build.rs
      - .github/actions/setup-macos-tauri/**
      - .github/workflows/warm-rust-cache.yml
  workflow_dispatch:

concurrency:
  group: warm-rust-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    name: Compile release deps (aarch64)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-macos-tauri
        with:
          target: aarch64-apple-darwin
          save-cache: "true"
          install-cli: "false"

      - name: Build desktop crate
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --target aarch64-apple-darwin -p cortex
